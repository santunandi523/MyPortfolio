server.port=8080

# Spring Application
spring.application.name=santu-nandi-portfolio-backend

# In-memory H2 database for out-of-the-box local execution
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
portfolio.jwt.secret=94a8f1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
portfolio.jwt.expiration-ms=86400000
portfolio.admin.passkey=admin2026

# Multipart File Upload limits (10MB maximum for academic PDFs)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Document Storage directory
portfolio.storage.upload-dir=./vault-storage

# CORS origins
portfolio.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://santunandi.dev
